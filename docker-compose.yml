version: '3.8'

services:
  api:
    build: .
    container_name: huracan-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_UI_API_KEY: ${QDRANT_UI_API_KEY}
      PYTHONUNBUFFERED: 1
      MONGO_URI: ${MONGO_URI}
    volumes:
      - model-cache:/app/model_cache
      - .:/app

volumes:
  model-cache: